<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML structure example using HTML elements">
    <meta name="author" content="George Adams">
    <title>Basic HTML Structure</title>
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="HTML Layout Logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li>
                <a href="https://www.churchofjesuschrist.org/?lang=eng">The Church of Jesus Christ

                <a
                  href="https://www.churchofjesuschrist.org/study/scriptures?lang=eng&platform=web">Scriptures</a>
            </li>
        </ul>
    </nav>

    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorum, laboriosam.</p>
        </section>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsum, tenetur!</p>
        </section>
    </main>

    <aside>
        <img
          src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/asuncion-paraguay/800x500/4-e49cfde212b104b97a0463371127c11e47f9c084.jpeg"
          alt="Paraguay Temple Night" width="200">

    <footer>
        <p>George Adams</p>
    </footer>

</html>
