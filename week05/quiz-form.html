<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz-form.css">
    <title>Basic Quiz Form</title>
</head>

<body>
    <main class="box">
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does the acronym "CSS" stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>
            <div class="quiz-item box">
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" required></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select type="text" id="q3" name="q3" required>
                    <option value="0" selected disabled>Choose One...</option>
                    <option value="1">A. &lt;!-- This is a comment --&gt;</option>
                    <option value="2">B. /* This is a comment */</option>
                    <option value="3">C. // This is a comment</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the bottom margin in this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4" required>
            </div>
            <button class="box" type="submit">Submit My Quiz</button>
        </form>
    </main>
</body>

</html>
